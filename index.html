<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChromaCraft - Color Palette Generator</title>
    <meta name="description" content="Lightning-fast color palette generator inspired by Coolors. Lock colors, press spacebar to generate, inspect shades, test color blindness, export, and preview in mockups." />
    <meta property="og:title" content="ChromaCraft - Color Palette Generator" />
    <meta property="og:description" content="Lightning-fast color palette generator inspired by Coolors. Lock colors, press spacebar to generate, inspect shades, test color blindness, export, and preview in mockups." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const isDev = window.location.hostname === 'localhost' ||
                    window.location.hostname === '127.0.0.1' ||
                    window.location.port === '3000' ||
                    window.location.hostname.includes('run.app');

      const script = document.createElement('script');
      script.type = 'module';
      script.crossOrigin = 'anonymous';

      if (!isDev) {
        // Production on GitHub Pages or static host
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.crossOrigin = 'anonymous';
        link.href = './assets/index.css';
        document.head.appendChild(link);

        script.src = './assets/app.js';
      } else {
        // Development environment
        script.src = '/src/main.tsx';
      }
      document.body.appendChild(script);
    </script>
  </body>
</html>
